[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intentprobe"
version = "0.2.0"
description = "Constraint-aware learned clarification with a reproducible synthetic audit"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["intentprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
